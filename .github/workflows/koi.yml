name: Update Profile Koi

on:
  schedule:
    # Runs once every day at 00:00 UTC
    - cron: "0 0 * * *"
  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          # Body color options: white, black, asagi, tea, gold, or platinum
          body: tea
          output-dir: koi

      - name: Commit generated koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/
          git diff --staged --quiet || git commit -m "chore: update profile koi"
          git push